# ===============================
# Production Database Configuration - Railway MySQL
# ===============================
spring.datasource.url=jdbc:mysql://nozomi.proxy.rlwy.net:21198/railway
spring.datasource.username=railway_user       # Replace with your Railway DB user
spring.datasource.password=StrongPassword123  # Replace with the password from Railway
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update  # In production, consider using 'validate' or Flyway/Liquibase
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# CORS Configuration
# ===============================
cors.allowed-origins=${FRONTEND_URL:https://filehuub.netlify.app,http://localhost:5173}

# ===============================
# Logging Configuration
# ===============================
logging.level.com.example.filestoring=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
