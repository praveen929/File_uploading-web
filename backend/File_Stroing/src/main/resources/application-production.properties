# ===============================
# Application Configuration
# ===============================
spring.application.name=FileStoring

# ===============================
# Production Database Configuration - Railway MySQL (Internal)
# ===============================
spring.datasource.url=jdbc:mysql://mysql.railway.internal:3306/railway
spring.datasource.username=root
spring.datasource.password=dMWYxBPNyEbjysFhgqYZYVifUbQEYELt
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:uploads/

# ===============================
# CORS Configuration
# ===============================
cors.allowed-origins=${FRONTEND_URL:https://filehuub.netlify.app,http://localhost:5173}

# ===============================
# Logging Configuration
# ===============================
logging.level.com.example.filestoring=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
