# ===============================
# Application Name
# ===============================
spring.application.name=FileStroing

# ===============================
# Production Database Configuration - Railway MySQL
# ===============================
spring.datasource.url=jdbc:mysql://nozomi.proxy.rlwy.net:21198/railway
spring.datasource.username=railway_user       # Replace with your Railway DB user
spring.datasource.password=StrongPassword123  # Replace with the password from Railway
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:uploads/

# ===============================
# Notes / Best Practices
# ===============================
# 1. Hibernate ddl-auto 'update' is fine for development, but in production consider 'validate' or migrations via Flyway/Liquibase
# 2. database-platform set to MySQL8Dialect for compatibility with MySQL 8.x
